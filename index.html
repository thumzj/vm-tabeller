<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotbolls-VM Live Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- Header / Nav -->
    <nav class="bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-blue-600 dark:text-blue-400">🏆 VM LIVE CENTER</h1>
            <button id="theme-toggle" class="p-2 bg-gray-200 dark:bg-gray-700 rounded-full hover:scale-105 transition-transform text-sm font-medium">
                🌓 Ändra tema
            </button>
        </div>
    </nav>

    <!-- Huvudinnehåll -->
    <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Vänster/Mitten: Matcher & Statistik -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Live & Kommande Matcher -->
            <section class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <span id="live-indicator" class="animate-pulse inline-block w-2 h-2 rounded-full bg-red-500"></span> Matcher & Live-resultat
                    </h2>
                    <span class="text-xs text-gray-500 dark:text-gray-400">Uppdateras live</span>
                </div>
                <div id="matches-container" class="space-y-3">
                    <p class="text-gray-500 animate-pulse text-sm">Hämtar livematcher från turneringen...</p>
                </div>
            </section>

            <!-- Spelarstatistik -->
            <section class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold mb-4">📊 Spelarstatistik (Skytteliga)</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-gray-200 dark:border-gray-700 text-gray-500">
                                <th class="pb-2">Spelare</th>
                                <th class="pb-2">Lag</th>
                                <th class="pb-2 text-right">Mål</th>
                            </tr>
                        </thead>
                        <tbody id="stats-container">
                            <tr><td colspan="3" class="text-gray-500 animate-pulse py-2">Hämtar målskyttar...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- Höger: Tabell -->
        <div class="space-y-6">
            <section class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold mb-4">📋 Aktuell Grupptabell</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-center border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-gray-200 dark:border-gray-700 text-gray-500 text-xs">
                                <th class="pb-2 text-left">Lag</th>
                                <th class="pb-2">M</th>
                                <th class="pb-2">+/-</th>
                                <th class="pb-2 font-bold text-blue-500">P</th>
                            </tr>
                        </thead>
                        <tbody id="table-container">
                            <tr><td colspan="4" class="text-gray-500 animate-pulse py-2">Genererar tabeller...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

    </main>

    <!-- JavaScript Logik -->
    <script>
        // Mörkt läge växlare
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Vi använder ett publikt, öppet sport-API inställt på VM (wm)
        const API_URL = 'https://openligadb.de'; 

        async function fetchRealTimeData() {
            try {
                const res = await fetch(API_URL);
                const matches = await res.json();
                
                const matchesContainer = document.getElementById('matches-container');
                matchesContainer.innerHTML = '';

                if (!matches || matches.length === 0) {
                    matchesContainer.innerHTML = '<p class="text-gray-500 text-sm">Inga aktuella matcher hittades för denna turnering.</p>';
                    return;
                }

                let teamStats = {};
                let playerGoals = {};

                matches.forEach(match => {
                    const homeTeam = match.team1.teamName;
                    const awayTeam = match.team2.teamName;
                    const isFinished = match.matchIsFinished;
                    let homeScore = 0;
                    let awayScore = 0;

                    if (match.matchResults && match.matchResults.length > 0) {
                        const finalResult = match.matchResults.find(r => r.resultName === "Endergebnis" || r.resultName === "Halbzeitergebnis") || match.matchResults;
                        homeScore = finalResult.pointsTeam1;
                        awayScore = finalResult.pointsTeam2;
                    }

                    const matchEl = document.createElement('div');
                    matchEl.className = "flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg border border-gray-100 dark:border-gray-700";
                    
                    const statusText = isFinished ? "SLUT" : (match.matchResults.length > 0 ? "LIVE" : "KOMMANDE");
                    const statusClass = isFinished ? "bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300" : (statusText === "LIVE" ? "bg-red-100 text-red-500 dark:bg-red-950/50" : "bg-blue-100 text-blue-500 dark:bg-blue-950/50");

                    matchEl.innerHTML = `
                        <div class="flex-1 font-medium flex items-center gap-2">
                            <img src="${match.team1.teamIconUrl}" class="w-5 h-5 object-contain inline" onerror="this.style.display='none'">
                            <span>${homeTeam}</span>
                        </div>
                        <div class="flex items-center gap-3 px-4 bg-gray-200 dark:bg-gray-700 rounded py-1 font-mono font-bold text-blue-600 dark:text-blue-400">
                            <span>${homeScore}</span>
                            <span>-</span>
                            <span>${awayScore}</span>
                        </div>
                        <div class="flex-1 text-right font-medium flex items-center justify-end gap-2">
                            <span>${awayTeam}</span>
                            <img src="${match.team2.teamIconUrl}" class="w-5 h-5 object-contain inline" onerror="this.style.display='none'">
                        </div>
                        <div class="ml-4 text-xs font-semibold px-2 py-0.5 rounded ${statusClass}">${statusText}</div>
                    `;
                    matchesContainer.appendChild(matchEl);

                    if (!teamStats[homeTeam]) teamStats[homeTeam] = { name: homeTeam, m: 0, goalsFor: 0, goalsAgainst: 0, p: 0 };
                    if (!teamStats[awayTeam]) teamStats[awayTeam] = { name: awayTeam, m: 0, goalsFor: 0, goalsAgainst: 0, p: 0 };

                    if (isFinished || match.matchResults.length > 0) {
                        teamStats[homeTeam].m += 1;
                        teamStats[awayTeam].m += 1;
                        teamStats[homeTeam].goalsFor += homeScore;
                        teamStats[homeTeam].goalsAgainst += awayScore;
                        teamStats[awayTeam].goalsFor += awayScore;
                        teamStats[awayTeam].goalsAgainst += homeScore;

                        if (homeScore > awayScore) {
                            teamStats[homeTeam].p += 3;
                        } else if (homeScore < awayScore) {
                            teamStats[awayTeam].p += 3;
                        } else {
                            teamStats[homeTeam].p += 1;
                            teamStats[awayTeam].p += 1;
                        }
                    }

                    if (match.goals && match.goals.length > 0) {
                        match.goals.forEach(goal => {
                            const playerName = goal.goalGetterName;
                            if (playerName) {
                                if (!playerGoals[playerName]) {
                                    playerGoals[playerName] = { name: playerName, team: goal.isOwnGoal ? "Självmål" : (goal.scoreTeam1 > goal.scoreTeam2 ? homeTeam : awayTeam), goals: 0 };
                                }
                                playerGoals[playerName].goals += 1;
                            }
                        });
                    }
                });

                renderLiveTable(teamStats);
                renderLiveStats(playerGoals);

            } catch (err) {
                console.error("Fel vid live-uppdatering:", err);
            }
        }

        function renderLiveTable(teamStats) {
            const tableContainer = document.getElementById('table-container');
            const sortedTeams = Object.values(teamStats).sort((a, b) => b.p - a.p || (b.goalsFor - b.goalsAgainst) - (a.goalsFor - a.goalsAgainst));
            if (sortedTeams.length === 0) {
                tableContainer.innerHTML = '<tr><td colspan="4" class="py-2 text-gray-500">Ingen tabell-data tillgänglig ännu.</td></tr>';
                return;
            }

            tableContainer.innerHTML = sortedTeams.slice(0, 8).map(t => {
                const gd = t.goalsFor - t.goalsAgainst;
                const gdText = gd > 0 ? `+${gd}` : gd;
                return `
                    <tr class="border-b border-gray-100 dark:border-gray-700/50 last:border-0 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                        <td class="py-2 text-left font-medium max-w-[120px] truncate">${t.name}</td>
                        <td class="py-2 text-gray-500">${t.m}</td>
                        <td class="py-2 text-gray-500">${gdText}</td>
                        <td class="py-2 font-bold text-blue-500">${t.p}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderLiveStats(playerGoals) {
            const statsContainer = document.getElementById('stats-container');
            const sortedPlayers = Object.values(playerGoals).sort((a, b) => b.goals - a.goals);

            if (sortedPlayers.length === 0) {
                statsContainer.innerHTML = '<tr><td colspan="3" class="py-2 text-gray-500 text-center">Inga mål registrerade i turneringen än.</td></tr>';
                return;
            }

            statsContainer.innerHTML = sortedPlayers.slice(0, 5).map(p => `
                <tr class="border-b border-gray-100 dark:border-gray-700/50 last:border-0 hover:bg-gray-50 dark:hover:bg-gray-800/30">
                    <td class="py-2 font-medium">${p.name}</td>
                    <td class="py-2 text-gray-500 text-xs">${p.team}</td>
                    <td class="py-2 text-right font-bold text-emerald-500">${p.goals}</td>
                </tr>
            `).join('');
        }

        fetchRealTimeData();
        setInterval(fetchRealTimeData, 60000);
    </script>
</body>
</html>
